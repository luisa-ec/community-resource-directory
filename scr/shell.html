<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Dark: 3 variations</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#e5e7eb;color:#111827}
.bar{background:#111827;color:#fff;padding:10px 14px;display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row b{font-size:15px}.row small{color:#d1d5db}.grp{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.bar button{border:1.5px solid #4b5563;background:transparent;color:#fff;border-radius:8px;padding:6px 11px;font:600 13px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.bar button[aria-pressed=true]{background:#fff;color:#111827;border-color:#fff}.bar button:focus-visible{outline:3px solid #5eead4;outline-offset:2px}
.pal{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}.sw{display:inline-flex;align-items:center;gap:6px;font-size:12px}.sw i{width:14px;height:14px;border-radius:4px;border:1px solid #9ca3af;display:inline-block}.lab{color:#d1d5db;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;align-self:center;margin-right:2px}
.info{margin:0;color:#e5e7eb;font-size:13px}.info a{color:#5eead4}
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:12px;overflow:auto}
iframe{border:0;background:#fff;height:100%;width:100%;max-width:100%;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);transition:width .2s}
@media(max-width:700px){.stage{padding:0}iframe{border-radius:0}}
</style></head><body>
<header class="bar"><div class="row"><div><b>Community Resource Directory: design prototypes</b> <small>Medical directory direction, recoloured from the design system</small></div><div class="grp" id="dv" role="group" aria-label="Preview size"></div></div>
<div class="grp" id="vr" role="group" aria-label="Version"></div><p class="info" id="in"></p></header>
<main class="stage"><iframe id="fr" title="Prototype preview" sandbox="allow-scripts allow-forms"></iframe></main>
<script>
/*DATA*/
const CSS=/*CSS*/;
const ENGINE=/*ENGINE*/;
const REFS=/*REFS*/;
const DEV=[['Desktop','100%'],['Tablet','768px'],['Mobile','390px']];
let R=0,V=0,D=0;const $=s=>document.querySelector(s),btn=(t,p,f)=>{const b=document.createElement('button');b.textContent=t;b.setAttribute('aria-pressed',p);b.onclick=f;return b};
function doc(c){const fam=[...new Set([c.hf,c.bf])].map(f=>'family='+f.replace(/ /g,'+')+':wght@400;700').join('&');
return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?'+fam+'&display=swap" rel="stylesheet"><style>'+CSS+'</style></head><body><div id="app"></div><scr'+'ipt>const CATS='+JSON.stringify(CATS)+',DATA='+JSON.stringify(DATA)+';('+ENGINE.toString()+')('+JSON.stringify(c.cfg)+')</scr'+'ipt></body></html>'}
function ui(){const r=REFS[R],v=r.v[V];
$('#dv').replaceChildren(...DEV.map(([t],i)=>btn(t,i==D,()=>{D=i;ui(false)})));

$('#vr').replaceChildren(Object.assign(document.createElement('span'),{className:'lab',textContent:'Version'}),...r.v.map((x,i)=>btn((i+1)+' · '+x.name,i==V,()=>{V=i;ui(true)})));
$('#in').innerHTML='<b>Version '+(V+1)+': '+v.name+'.</b> '+v.d+'<span class="pal">'+v.pal.map(p=>'<span class="sw"><i style="background:'+p[1]+'"></i>'+p[0]+' '+p[1]+'</span>').join('')+'</span>';
$('#fr').style.width=DEV[D][1];try{history.replaceState(null,'','#r'+(R+1)+'v'+(V+1))}catch(e){}}
function load(){$('#fr').srcdoc=doc(REFS[R].v[V])}
const m=/#r(\d)v(\d)/.exec(location.hash);if(m){R=0;V=Math.min(2,m[2]-1)}
const _ui=ui;ui=function(l){_ui();if(l!==false)load()};ui(true);
document.addEventListener('keydown',e=>{if(e.target.tagName=='BUTTON'||e.altKey||e.ctrlKey)return;if(e.key=='ArrowRight'){V=(V+1)%3;ui(true)}if(e.key=='ArrowLeft'){V=(V+2)%3;ui(true)}});
</script></body></html>
